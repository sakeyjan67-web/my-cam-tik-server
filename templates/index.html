<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Upload</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: min(92%, 500px);
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 18px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            white-space: pre-wrap;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload Video</h1>

        <form id="uploadForm">
            <label for="title">Video Title</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter video title"
                required
            >

            <label for="video">Select Video</label>
            <input
                type="file"
                id="video"
                name="video"
                accept="video/*"
                required
            >

            <button type="submit" id="uploadBtn">Upload Video</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const form = document.getElementById("uploadForm");
        const button = document.getElementById("uploadBtn");
        const status = document.getElementById("status");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const title = document.getElementById("title").value.trim();
            const video = document.getElementById("video").files[0];

            if (!title || !video) {
                showStatus("Title aur video dono select karein.", false);
                return;
            }

            const formData = new FormData();
            formData.append("title", title);
            formData.append("video", video);

            button.disabled = true;
            button.textContent = "Uploading...";
            showStatus("Video upload ho rahi hai, please wait...", true);

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showStatus(
                        "Video successfully upload ho gayi!\nFile ID: " +
                        result.file_id,
                        true
                    );
                    form.reset();
                } else {
                    showStatus(
                        "Upload failed:\n" +
                        (result.error || "Unknown error"),
                        false
                    );
                }
            } catch (error) {
                showStatus(
                    "Server se connection error:\n" + error.message,
                    false
                );
            } finally {
                button.disabled = false;
                button.textContent = "Upload Video";
            }
        });

        function showStatus(message, success) {
            status.textContent = message;
            status.className = success ? "success" : "error";
        }
    </script>
</body>
</html>
